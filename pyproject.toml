[project]
name = "office2pdf"
version = "0.1.0"
description = "Lightweight async Python library for converting Office files to PDF using Microsoft Graph"
readme = "README.md"
authors = [
    { name = "Sam Quigley", email = "quigley@emerose.com" }
]
requires-python = ">=3.12"
dependencies = [
    "msal>=1.31.1",
    "httpx>=0.28.1",
    "pydantic>=2.10.5",
]


[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enable maximally strict linting
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # mccabe
    "COM",   # flake8-commas
    "D",     # pydocstyle
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "EM",    # flake8-errmsg
    "ERA",   # eradicate
    "EXE",   # flake8-executable
    "F",     # pyflakes
    "FA",    # flake8-future-annotations
    "FBT",   # flake8-boolean-trap
    "FIX",   # flake8-fixme
    "FLY",   # flynt
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "INT",   # flake8-gettext
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TCH",   # flake8-type-checking
    "TD",    # flake8-todos
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
    "YTT",   # flake8-2020
]

ignore = [
    "COM812",  # Conflicts with ruff formatter
    "ISC001",  # Conflicts with ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = [
    "T20",   # Allow print statements in examples
    "S101",  # Allow assert in examples
    "INP001", # Examples don't need __init__.py
]
"src/office2pdf/types.py" = [
    "ANN401",  # Allow Any in Pydantic model_post_init
    "PYI063",  # Pydantic override, not using PEP 570
]
"tests/*.py" = [
    "S101",    # Allow assert in tests
    "S105",    # Allow hardcoded passwords in tests (comparison)
    "S106",    # Allow hardcoded passwords in tests (assignment)
    "PLR2004", # Allow magic values in tests
    "SLF001",  # Allow private member access in tests
    "B017",    # Allow broad exceptions in tests
    "PT011",   # Allow broad pytest.raises in tests
    "PT017",   # Allow assert in except blocks in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.398",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]
